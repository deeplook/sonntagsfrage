name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh Data]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      attempt:
        description: Retry attempt number (set automatically)
        default: "1"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Refresh Data pushes a new commit after its own run starts.
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Generate share pages and preview images
        run: uv run sonntagsfrage-share-pages --output-dir share
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/charts _site/share
          cp index.html _site/index.html
          cp charts/election-polls.html _site/charts/election-polls.html
          cp charts/election-polls-preview.png _site/charts/election-polls-preview.png
          cp share/*.html share/*.png _site/share/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # deploy-pages sometimes fails because GitHub's artifact API lags behind the
  # upload. Re-running the failed job cannot fix that (it uploads a duplicate
  # artifact), so dispatch a fresh run instead, at most 3 attempts in total.
  retry:
    needs: deploy
    if: ${{ failure() && fromJSON(github.event.inputs.attempt || '1') < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a fresh run after a delay
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          sleep 60
          NEXT=$((ATTEMPT + 1))
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f attempt="$NEXT"

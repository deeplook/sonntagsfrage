name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Refresh Data]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Refresh Data pushes a new commit after its own run starts.
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/charts
          cp index.html _site/index.html
          cp charts/election-polls.html _site/charts/election-polls.html
          cp charts/election-polls-preview.png _site/charts/election-polls-preview.png
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

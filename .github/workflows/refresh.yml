name: Refresh Data

on:
  schedule:
    # Monday 06:00 UTC — new German federal polls typically appear Sunday evening
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Fetch latest poll data
        run: uv run sonntagsfrage --source all

      - name: Regenerate interactive chart
        run: uv run sonntagsfrage-race

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts/election-polls.html
          if git diff --staged --quiet; then
            echo "No changes — data is already up to date."
          else
            git commit -m "chore: refresh poll data and chart"
            git push
          fi

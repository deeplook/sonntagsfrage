[project]
name = "elections"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dinu Gherman", email = "gherman@darwin.in-berlin.de" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
